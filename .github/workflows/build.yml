name: Build Android APK

on:
  push:
      branches: [ "main" ]
        workflow_dispatch: 

        jobs:
          build:
              runs-on: ubuntu-latest
                  steps:
                      - name: Checkout Code
                            uses: actions/checkout@v4
                                  
                                      - name: Set Up JDK 17
                                            uses: actions/setup-java@v4
                                                  with:
                                                          distribution: 'zulu'
                                                                  java-version: '17'

                                                                      - name: Setup Android NDK
                                                                            uses: nttld/setup-ndk@v1
                                                                                  id: setup-ndk
                                                                                        with:
                                                                                                ndk-version: r27d
                                                                                                        
                                                                                                            - name: Download NCNN & OpenCV
                                                                                                                  run: |
                                                                                                                          mkdir -p app/src/main/jni/
                                                                                                                                  wget https://github.com/Tencent/ncnn/releases/download/20240102/ncnn-20240102-android-vulkan.zip
                                                                                                                                          unzip ncnn-20240102-android-vulkan.zip -d app/src/main/jni/
                                                                                                                                                  wget https://github.com/nihui/opencv-mobile/releases/download/v23/opencv-mobile-2.4.13.6-android.zip
                                                                                                                                                          unzip opencv-mobile-2.4.13.6-android.zip -d app/src/main/jni/
                                                                                                                                                                  
                                                                                                                                                                      - name: Status Check
                                                                                                                                                                            run: |
                                                                                                                                                                                    echo "Dateien erfolgreich heruntergeladen!"
                                                                                                                                                                                            ls -R app/src/main/jni/
                                                                                                                                                                                            